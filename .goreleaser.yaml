version: 2

builds:
  - id: bbctl
    main: ./cmd/bbctl
    binary: bbctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/migrx-io/backedblock/internal/cli.Version={{.Version}}

archives:
  - id: bbctl
    name_template: "bbctl_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Notes come from CHANGELOG.md (--release-notes in release.yml). Re-running on an existing
# release replaces its notes and files.
release:
  mode: replace
  replace_existing_artifacts: true

